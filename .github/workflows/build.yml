name: Compilar EBOOT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: EBOOT.PBP
